<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Kingdom | الواجهة المحدثة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #d4af37; --bg: #050508; }
        [data-theme="purple"] { --primary: #a020f0; }

        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; }

        /* الغلاف المحسن للهواتف */
        .header-cover {
            width: 100%;
            height: 250px; /* ارتفاع مناسب للهاتف */
            background: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200') center/cover;
            filter: brightness(0.6);
        }

        .main-container { padding: 20px; text-align: center; }

        /* موقع زر الألوان */
        .theme-btn { 
            background: var(--primary); border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
        }

        /* تحسين صورة إينوماكي والشعاع */
        .avatar-wrapper { width: 150px; height: 150px; margin: -75px auto 20px; }
        .avatar-img { 
            width: 100%; height: 100%; border-radius: 50%; 
            border: 4px solid var(--primary); 
            box-shadow: 0 0 20px var(--primary);
        }

        /* قادة إيليت التفاعليون */
        .leaders-section { display: none; margin-top: 20px; }
        .leader-card { 
            background: #111; padding: 15px; border-radius: 15px; margin: 10px auto; max-width: 300px;
        }
        .leader-img { 
            width: 120px; height: 120px; border-radius: 50%; 
            border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary);
        }

        .btn-toggle { cursor: pointer; padding: 10px; background: #222; border: 1px solid var(--primary); color: #fff; margin: 10px; }
    </style>
</head>
<body>

    <div class="header-cover"></div>

    <div class="main-container">
        <!-- زر تغيير الألوان فوق النصوص -->
        <button class="theme-btn" onclick="toggleTheme()">تغيير النمط اللوني</button>
        
        <h1>مملكة إيليت</h1>

        <div class="avatar-wrapper">
            <img src="YOUR_IMAGE_URL" class="avatar-img" alt="إينوماكي">
        </div>

        <button class="btn-toggle" onclick="toggleSection('royal-scroll')">السجل الملكي</button>
        <div id="royal-scroll" style="display:none;">وصف السجل الملكي هنا...</div>

        <button class="btn-toggle" onclick="toggleSection('elite-bio')">نبذة عن إيليت</button>
        <div id="elite-bio" style="display:none;">وصف إيليت هنا...</div>

        <!-- زر إظهار القادة -->
        <button class="btn-toggle" onclick="toggleSection('leaders-section')">قادة النخبة العليا</button>
        <div id="leaders-section" class="leaders-section">
            <div class="leader-card">
                <img src="YOUR_LEADER_URL" class="leader-img" alt="كرولو">
                <h3>كرولو</h3>
            </div>
            <div class="leader-card">
                <img src="YOUR_LEADER_URL" class="leader-img" alt="باين">
                <h3>باين</h3>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.dataset.theme = document.body.dataset.theme === 'purple' ? '' : 'purple';
        }
        function toggleSection(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
