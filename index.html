<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة إيليت⚜️| الواجهة السينمائية الحديثة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* المتغيرات العامة للألوان والتصميم - الوضع الافتراضي (الذهبي الملكي) */
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(12, 17, 27, 0.75); /* تعميق الخلفية لبروز الأصفر */
            --text-main: #ffffff;
            --primary-color: #ffcc00; /* ذهبي ملكي نقي وعالي التباين والوضوح */
            --secondary-glow: #ff5500; /* توهج ناري */
            --third-glow: #00ffff; /* توهج كريستالي */
            --font-family: 'Cairo', sans-serif;
            --particle-color: rgba(255, 204, 0, 0.5);
        }

        /* الوضع البنفسجي الأسطوري الغامق والفخم */
        [data-theme="mythic-purple"] {
            --bg-dark: #020105; 
            --primary-color: #bd1ffff; 
            --secondary-glow: #4a148c; 
            --third-glow: #ff007f; 
            --particle-color: rgba(189, 31, 255, 0.5);
            --bg-card: rgba(18, 10, 28, 0.75);
        }

        /* إعادة تعيين الخصائص الافتراضية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background: linear-gradient(45deg, var(--bg-dark), #090414, #040914, #0d0212, var(--bg-dark));
            background-size: 400% 400%;
            animation: mysteriousWave 15s ease infinite;
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes mysteriousWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* حاوية تأثير تساقط الجزيئات الأسطورية المحدثة للأداء */
        #snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: var(--particle-color);
            text-shadow: 0 0 5px var(--primary-color);
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            will-change: transform, opacity;
        }

        @keyframes fall {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(20px); opacity: 0; }
        }

        header, section, footer {
            position: relative;
            z-index: 2;
        }

        /* زر تبديل المظهر المثبت أعلى الصفحة في الجانب */
        .theme-switcher-corner {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 2000;
            background: rgba(5, 5, 8, 0.9);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6), 0 0 10px var(--primary-color);
            transition: all 0.3s ease;
        }

        .theme-switcher-corner:hover {
            transform: scale(1.05);
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        /* الهيدر وقائمة التنقل */
        header {
            background-color: rgba(5, 5, 8, 0.9);
            border-bottom: 2px solid var(--primary-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 12px var(--primary-color);
        }

        .nav-menu {
            display: flex;
            gap: 25px;
        }

        .nav-menu a {
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
            text-decoration: none;
            color: #fff;
        }

        .nav-menu a:hover, .nav-menu a.active { color: var(--primary-color); }
        .nav-menu a::after {
            content: ''; position: absolute; width: 0; height: 2px; bottom: 0; right: 0;
            background-color: var(--primary-color); transition: width 0.3s ease;
        }
        .nav-menu a:hover::after { width: 100%; }

        /* قسم الإمبراطور والواجهة العلوية */
        .emperor-section {
            position: relative;
            margin-top: 74px;
            text-align: center;
            background-color: rgba(15, 18, 26, 0.2);
            border-bottom: 1px solid rgba(255, 204, 0, 0.15);
            padding-bottom: 60px;
        }

        /* الغلاف الشريطي السينمائي الناعم والرفيع المدمج بالفخومة */
        .emperor-cover {
            height: 180px; 
            background: linear-gradient(rgba(5, 5, 8, 0.3), rgba(5, 5, 8, 0.98)), 
                        url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200') no-repeat center 20%/cover;
            filter: brightness(40%) contrast(115%);
            box-shadow: inset 0 -30px 40px rgba(5, 5, 8, 1);
        }

        .emperor-profile-container {
            max-width: 900px;
            margin: -90px auto 0 auto; 
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        /* إطار التوهج المحدث والآمن للأداء عالي التباين */
        .wave-glow-avatar {
            width: 190px; /* تم تكبير حجم الصورة الرئيسية هنا */
            height: 190px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 5px; 
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-glow), var(--third-glow), var(--primary-color));
            background-size: 200% 200%;
            animation: lightPulseGlow 3s ease-in-out infinite alternate;
            will-change: box-shadow;
        }

        @keyframes lightPulseGlow {
            0% { box-shadow: 0 0 15px var(--primary-color), inset 0 0 10px var(--secondary-glow); background-position: 0% 50%; }
            100% { box-shadow: 0 0 30px var(--primary-color), inset 0 0 15px var(--third-glow); background-position: 100% 50%; }
        }

        /* توحيد الفلاتر والإضاءة للصور لمنع اللاق وحفظ الهوية الفنية */
        .wave-glow-avatar img, .deputy-avatar-wave-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #050508; 
            filter: brightness(95%) contrast(105%); /* إضاءة متزنة وموحدة وسينمائية */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* نص الترحيب الانسيابي العادي */
        .text-elite-normal {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: inline-block;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 16px;
            border-radius: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .text-elite-normal i {
            color: var(--primary-color);
            margin: 0 6px;
        }

        .emperor-name {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 20px;
        }

        .emperor-name span {
            color: var(--primary-color);
            text-shadow: 0 0 25px var(--primary-color), 0 2px 5px rgba(0,0,0,0.9);
        }

        /* أزرار التحكم التفاعلي */
        .interactive-btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            flex-wrap: wrap;
        }

        .btn-interactive {
            background: rgba(15, 22, 36, 0.7);
            border: 2px solid var(--primary-color);
            color: var(--text-main);
            padding: 12px 26px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-interactive:hover, .btn-interactive.active-box {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        /* اللوحات المنبثقة التفاعلية */
        .info-disclosure-box {
            display: none;
            margin: 15px auto;
            background: var(--bg-card);
            border: 1px solid var(--primary-color);
            padding: 25px;
            border-radius: 12px;
            text-align: right;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            animation: slideDownFade 0.3s ease forwards;
            max-width: 650px;
        }

        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-disclosure-box h3 {
            color: var(--primary-color);
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* حاوية قادة إيليت العليا التفاعلية الممتدة */
        .leaders-disclosure-container {
            display: none;
            margin-top: 30px;
            animation: slideDownFade 0.4s ease forwards;
            width: 100%;
        }

        .deputies-free-flow-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px; 
            margin: 20px auto 0 auto;
            max-width: 650px;
            width: 100%;
        }

        .single-leader-row {
            display: flex;
            align-items: center;
            gap: 30px;
            width: 100%;
            text-align: right;
            padding: 15px;
            background: rgba(10, 15, 26, 0.4);
            border-radius: 14px;
            border: 1px solid rgba(255, 204, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .single-leader-row:hover {
            transform: translateX(-5px);
            border-color: rgba(255, 204, 0, 0.3);
            background: rgba(10, 15, 26, 0.6);
        }

        /* إطار صور القادة المكبر والخفيف للأداء المستقر */
        .deputy-avatar-wave-wrapper {
            width: 140px; /* تم تكبير حجم صور النواب هنا لبروز فخم */
            height: 140px;
            border-radius: 50%;
            padding: 5px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-glow), var(--primary-color));
            background-size: 200% 200%;
            animation: lightPulseGlow 3.5s ease-in-out infinite alternate;
        }

        .deputy-text-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* حدود متموجة ونابضة حول شارات ألقاب وصلاحيات النواب */
        .deputy-tag-wave-border {
            font-size: 13px;
            color: #ffffff;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 16px;
            border-radius: 50px;
            width: fit-content;
            background: #050508;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        .deputy-tag-wave-border i {
            color: var(--primary-color);
        }

        .deputy-name-plain {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }

        /* الأقسام العامة */
        .section-container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .section-title {
            text-align: center; font-size: 32px; font-weight: 800; margin-bottom: 40px;
            position: relative; color: var(--primary-color);
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .section-title::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 3px; background-color: var(--primary-color);
        }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        
        .card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 204, 0, 0.15);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
        }
        .card:hover { border-color: var(--primary-color); transform: translateY(-5px); box-shadow: 0 12px 40px rgba(255, 204, 0, 0.15); }
        .card i { font-size: 40px; color: var(--primary-color); margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 204, 0, 0.4); }
        .card h3 { color: #ffffff; margin-bottom: 10px; }
        .card p { color: #cbd5e1; }

        footer { background-color: #030305; padding: 40px 20px; text-align: center; border-top: 2px solid var(--primary-color); margin-top: 40px; }
        footer .copyright { color: #94a3b8; font-weight: 600; }

        /* تكييف شاشات الهواتف */
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .emperor-cover { height: 130px; } 
            .emperor-profile-container { margin: -75px auto 0 auto; }
            .wave-glow-avatar { width: 140px; height: 140px; }
            .deputy-avatar-wave-wrapper { width: 110px; height: 110px; }
            .emperor-name { font-size: 28px; }
            .single-leader-row { flex-direction: column; text-align: center; gap: 12px; padding: 20px 10px; }
            .deputy-text-block { align-items: center; }
        }
    </style>
</head>
<body>

    <button class="theme-switcher-corner" onclick="toggleCustomTheme()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="theme-btn-text">المظهر</span>
    </button>

    <div id="snow-container"></div>

    <header>
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-crown"></i>
                <span>مملكة إيليت</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active">الرئيسية</a>
                <a href="dukes.html">دوقات المملكة</a>
                <a href="guilds.html">النقابات والأدميرالات</a>
                <a href="legends.html">المعتزلين والتكريم</a>
            </nav>
        </div>
    </header>

    <section class="emperor-section">
        <div class="emperor-cover"></div>
        
        <div class="emperor-profile-container">
